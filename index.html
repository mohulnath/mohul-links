<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohulnath | All Links</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

</head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0
  }

  body,
  html {
    background: #060610
  }

  .page {
    min-height: 100vh;
    background: #060610;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem 3rem;
    font-family: 'Space Grotesk', sans-serif;
    position: relative;
    overflow: hidden
  }

  canvas#stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none
  }

  .card {
    width: 100%;
    max-width: 390px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 2
  }

  .avatar-wrap {
    position: relative;
    margin-bottom: 1.1rem
  }
  .avatar {
  width: 92px;
  height: 92px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7c3aed, #2563eb);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  z-index: 1;
  border: 2px solid #1e1b4b;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

  .avatar-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: linear-gradient(135deg, #7c3aed, #06b6d4, #2563eb, #7c3aed) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: destination-out;
    mask-composite: exclude;
    animation: spin 3s linear infinite
  }

  @keyframes spin {
    to {
      transform: rotate(360deg)
    }
  }

  .dot-status {
    position: absolute;
    bottom: 5px;
    right: 5px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #22c55e;
    border: 2.5px solid #060610;
    z-index: 2
  }

  .dot-status::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1.5px solid #22c55e;
    animation: ripple 2s ease infinite;
    opacity: 0
  }

  @keyframes ripple {
    0% {
      transform: scale(1);
      opacity: 0.7
    }

    100% {
      transform: scale(2);
      opacity: 0
    }
  }

  .username {
    font-size: 1.35rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 3px;
    letter-spacing: -0.3px
  }

  .handle {
    font-family: 'Fira Code', monospace;
    font-size: 0.75rem;
    color: #7c3aed;
    margin-bottom: 10px;
    letter-spacing: 0.4px
  }

  .bio {
    text-align: center;
    font-size: 0.83rem;
    color: #94a3b8;
    line-height: 1.65;
    margin-bottom: 1rem;
    max-width: 270px
  }

  .bio strong {
    color: #a78bfa;
    font-weight: 500
  }

  .visitor-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(124, 58, 237, 0.1);
    border: 1px solid rgba(124, 58, 237, 0.28);
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 1.3rem;
    font-size: 0.71rem;
    font-family: 'Fira Code', monospace;
    color: #a78bfa
  }

  .vdot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    animation: blink 1.4s ease infinite
  }

  @keyframes blink {

    0%,
    100% {
      opacity: 1
    }

    50% {
      opacity: 0.25
    }
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 11px;
    margin-bottom: 1.5rem
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 14px;
    background: rgba(124, 58, 237, 0.07);
    border: 1px solid rgba(124, 58, 237, 0.2);
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    transition: all 0.25s;
    position: relative;
    overflow: hidden
  }

  .link-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(124, 58, 237, 0.2), transparent);
    transform: translateX(-100%);
    transition: transform 0.55s
  }

  .link-btn:hover::before {
    transform: translateX(100%)
  }

  .link-btn:hover {
    border-color: rgba(124, 58, 237, 0.65);
    background: rgba(124, 58, 237, 0.14);
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(124, 58, 237, 0.2)
  }

  .link-btn:active {
    transform: scale(0.97)
  }

  .icon-wrap {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 1.05rem
  }

  .ip {
    background: rgba(124, 58, 237, 0.18);
    border: 1px solid rgba(124, 58, 237, 0.38);
    color: #a78bfa
  }

  .ig {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: #e2e8f0
  }

  .il {
    background: rgba(37, 99, 235, 0.18);
    border: 1px solid rgba(37, 99, 235, 0.38);
    color: #60a5fa
  }

  .ir {
    background: rgba(34, 197, 94, 0.13);
    border: 1px solid rgba(34, 197, 94, 0.32);
    color: #4ade80
  }

  .link-text {
    font-size: 0.9rem;
    font-weight: 600;
    display: block;
    line-height: 1.2
  }

  .link-sub {
    font-size: 0.67rem;
    color: #475569;
    font-family: 'Fira Code', monospace;
    display: block;
    margin-top: 1px
  }

  .link-arrow {
    font-size: 0.8rem;
    color: #334155;
    transition: all 0.2s;
    margin-left: auto;
    flex-shrink: 0
  }

  .link-btn:hover .link-arrow {
    color: #a78bfa;
    transform: translateX(4px)
  }

  .stats-row {
    display: flex;
    gap: 10px;
    width: 100%;
    margin-bottom: 1.4rem
  }

  .stat-card {
    flex: 1;
    background: rgba(15, 10, 40, 0.7);
    border: 1px solid rgba(124, 58, 237, 0.2);
    border-radius: 12px;
    padding: 12px;
    text-align: center
  }

  .stat-num {
    font-size: 1.15rem;
    font-weight: 700;
    color: #a78bfa;
    font-family: 'Fira Code', monospace
  }

  .stat-label {
    font-size: 0.63rem;
    color: #475569;
    font-family: 'Fira Code', monospace;
    margin-top: 2px
  }

  .footer {
    font-size: 0.64rem;
    color: #1e293b;
    font-family: 'Fira Code', monospace;
    letter-spacing: 0.5px
  }
</style>

<body>

  <canvas id="stars"></canvas>
  
  <div class="page">
    <div class="card">

      <div class="bio">

      <div class="stats-row">

        <div class="stat-card">

        <div class="stat-card">
          <div class="stat-num">100%</div>

      </div>
  
      <div class="links">
        <a href="https://mohulnath-portfolio.netlify.app/" class="link-btn" target="_blank"">
          <div class="icon-wrap ip"><i class="ti ti-layout-dashboard" aria-hidden="true"></i></div>
          <div style="flex:1">
            <span class="link-text">Portfolio</span>
            <span class="link-sub">mohulnath.dev</span>

        <a href="https://github.com/mohulnath" class="link-btn" target="_blank"">
          <div class="icon-wrap ig"><i class="ti ti-brand-github" aria-hidden="true"></i></div>
          <div style="flex:1">
            <span class="link-text">GitHub</span>
            <span class="link-sub">github.com/mohulnath</span>
          </div>
          <i class="ti ti-arrow-right link-arrow" aria-hidden="true"></i>
        </a>
        <a href="https://www.linkedin.com/in/mohulnath/" class="link-btn" target="_blank"">
          <div class="icon-wrap il"><i class="ti ti-brand-linkedin" aria-hidden="true"></i></div>
          <div style="flex:1">
            <span class="link-text">LinkedIn</span>
            <span class="link-sub">connect with me</span>

        <a href="https://drive.google.com/file/d/1tt6XCF5mhy7f4sQJXV2q3QMEeH9aslgw/view?usp=sharing" class="link-btn" target="_blank"">
          <div class="icon-wrap ir"><i class="ti ti-file-cv" aria-hidden="true"></i></div>
          <div style="flex:1">
            <span class="link-text">My Resume</span>
            <span class="link-sub">download PDF</span>

          <i class="ti ti-arrow-right link-arrow" aria-hidden="true"></i>
        </a>
      </div>
  
      <div class="footer">crafted with <span style="color: red;">♥</span> by mohulnath · 2025</div>
    </div>
  </div>
  
</body>
<script>
  // Stars Background Animation
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 180; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.2,
      o: Math.random(),
      s: Math.random() * 0.007 + 0.002,
      d: Math.random() < 0.5 ? 1 : -1
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    stars.forEach(s => {
      s.o += s.s * s.d;

      if (s.o >= 1 || s.o <= 0.05) {
        s.d *= -1;
      }

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(167, 139, 250, ${s.o})`;
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }

  draw();

  // Total Visitor Count
  const visitorElement = document.getElementById('vcnt');

  fetch('https://api.countapi.xyz/hit/mohulnath-portfolio/visitors')
    .then(response => response.json())
    .then(data => {
      // Starting count from 400
      const totalVisitors = data.value + 400;

      visitorElement.textContent = totalVisitors.toLocaleString();
    })
    .catch(error => {
      console.error('Visitor count error:', error);

      // Fallback value
      visitorElement.textContent = '400';
    });
</script>
